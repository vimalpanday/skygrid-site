<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Blog | SkyGrid IT Services</title>
<meta name="description" content="SkyGrid IT Services blog and technology insights.">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://unpkg.com; style-src 'self' 'unsafe-inline'; img-src 'self' https://frqglytczzhhxwenzrys.supabase.co data: blob:; connect-src 'self' https://frqglytczzhhxwenzrys.supabase.co; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests">
<link rel="stylesheet" href="/theme.css"><script src="https://cdn.tailwindcss.com"></script>
</head><body class="bg-slate-50 text-slate-900">
<header class="sticky top-0 z-50 glass border-b border-slate-100/70 bg-white/90"><div class="max-w-5xl mx-auto px-5 h-20 flex items-center justify-between"><a href="/" class="flex items-center gap-3"><img src="https://frqglytczzhhxwenzrys.supabase.co/storage/v1/object/public/site-assets/skygrid-logo-1789811187604" class="logo-img" alt="SkyGrid IT Services logo" onerror="this.onerror=null;this.src="/skygrid-logo.png""><div class="leading-tight hidden sm:block"><div class="font-extrabold text-lg">SKYGRID</div><div class="text-[10px] tracking-[.32em] text-slate-500">IT SERVICES</div></div></a><a href="/" class="btn-secondary">← Back to Website</a></div></header>
<main class="max-w-4xl mx-auto px-5 py-14">
<div id="loading" class="text-slate-500">Loading blog…</div>
<article id="blog" class="hidden"><div class="text-sm font-bold text-blue-600 uppercase tracking-widest">Insights</div><h1 id="title" class="text-4xl md:text-5xl font-black mt-3 tracking-tight"></h1><div id="date" class="mt-4 text-sm text-slate-500"></div><div id="excerpt" class="mt-7 text-xl text-slate-600 leading-relaxed"></div><div id="content" class="mt-10 card p-7 md:p-10 bg-white text-slate-700 leading-8 whitespace-pre-line"></div></article>
<div id="error" class="hidden card p-8 bg-white"><h1 class="text-2xl font-black">Blog not found</h1><p class="mt-3 text-slate-600">This blog may have been removed or is not published.</p><a href="/" class="mt-6 inline-block font-bold text-blue-600">← Back to Website</a></div>
</main>
<script>
(async function(){
 const esc=v=>{const d=document.createElement('div');d.textContent=v??'';return d.innerHTML};
 const params=new URLSearchParams(location.search),slug=params.get('slug');
 try{
  if(!slug)throw Error('Missing slug');
  const r=await fetch('https://frqglytczzhhxwenzrys.supabase.co/functions/v1/skygrid-api/site-content',{cache:'no-store'});
  if(!r.ok)throw Error('Unable to load blog');
  const d=await r.json();
  const b=(d.blogs||[]).find(x=>String(x.slug||'')===slug && String(x.status||'').toLowerCase()==='published');
  if(!b)throw Error('Not found');
  document.title=(b.title||'Blog')+' | SkyGrid IT Services';
  document.getElementById('title').textContent=b.title||'';
  document.getElementById('date').textContent=b.published_at?new Date(b.published_at).toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'}):'';
  document.getElementById('excerpt').textContent=b.excerpt||'';
  document.getElementById('content').textContent=b.content||'';
  document.getElementById('loading').classList.add('hidden');document.getElementById('blog').classList.remove('hidden');
 }catch(e){document.getElementById('loading').classList.add('hidden');document.getElementById('error').classList.remove('hidden');console.warn(e)}
})();
</script></body></html>
